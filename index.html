<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能总结</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200..800;1,9..40,200..800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #b0b0b8;
      --input-bg: rgba(255, 255, 255, 0.65);
      --input-border: rgba(0, 0, 0, 0.10);
      --input-focus-border: rgba(0, 0, 0, 0.22);
      --btn-bg: #1a1a1a;
      --btn-hover: #2d2d2f;
      --btn-text: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.08);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 26px;
      --transition: 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle ambient gradient orb */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(180px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 620px;
      height: 620px;
      background: radial-gradient(circle, rgba(120, 130, 200, 0.10), transparent 70%);
      top: -20%;
      left: -10%;
    }
    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(180, 175, 160, 0.09), transparent 70%);
      bottom: -15%;
      right: -8%;
    }
    .orb-3 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(100, 120, 180, 0.07), transparent 70%);
      top: 55%;
      left: 55%;
    }

    /* Main container */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      padding: 0 28px;
    }

    /* Glass card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(48px) saturate(160%);
      -webkit-backdrop-filter: blur(48px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 56px 48px 48px;
      box-shadow: var(--shadow-sm), var(--shadow-md);
      transition: box-shadow var(--transition);
    }

    .card:focus-within {
      box-shadow: var(--shadow-sm), var(--shadow-lg);
      border-color: rgba(0, 0, 0, 0.12);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 44px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #636366;
      background: rgba(0, 0, 0, 0.04);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 22px;
    }

    .title {
      font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.18;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-secondary);
      letter-spacing: 0.004em;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Input area */
    .input-group {
      display: flex;
      gap: 10px;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .input-wrapper .icon-left {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .input-wrapper .icon-left svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-tertiary);
      stroke-width: 1.5;
      fill: none;
      transition: stroke var(--transition);
    }

    .url-input {
      width: 100%;
      height: 54px;
      padding: 0 48px 0 46px;
      font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--text-primary);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: all var(--transition);
      letter-spacing: 0.01em;
    }

    .url-input::placeholder {
      color: var(--text-tertiary);
      font-weight: 350;
    }

    .url-input:focus {
      border-color: var(--input-focus-border);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.03);
    }

    .url-input:focus ~ .icon-left svg,
    .input-wrapper:focus-within .icon-left svg {
      stroke: #555;
    }

    /* Clear button */
    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--transition), background var(--transition);
      pointer-events: none;
    }

    .clear-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .clear-btn:hover {
      background: rgba(0, 0, 0, 0.16);
    }

    .clear-btn svg {
      width: 11px;
      height: 11px;
      stroke: #666;
      stroke-width: 2;
    }

    /* Submit button */
    .submit-btn {
      height: 54px;
      padding: 0 32px;
      font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      font-weight: 510;
      letter-spacing: 0.01em;
      color: var(--btn-text);
      background: var(--btn-bg);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .submit-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    }

    .submit-btn:active {
      transform: scale(0.975) translateY(0);
      transition: all 0.08s ease;
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .submit-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Result area */
    .result-area {
      margin-top: 28px;
      display: none;
    }

    .result-area.active {
      display: block;
      animation: fadeSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-inner {
      background: rgba(0, 0, 0, 0.025);
      border-radius: var(--radius-sm);
      padding: 20px 22px;
      min-height: 80px;
      max-height: 360px;
      overflow-y: auto;
      font-size: 14.5px;
      line-height: 1.72;
      color: #333;
      letter-spacing: 0.012em;
    }

    .result-inner::-webkit-scrollbar {
      width: 6px;
    }

    .result-inner::-webkit-scrollbar-track {
      background: transparent;
    }

    .result-inner::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.10);
      border-radius: 3px;
    }

    /* Error state */
    .result-inner.error {
      color: #c0392b;
      background: rgba(192, 57, 43, 0.04);
    }

    /* Footer hint */
    .hint {
      text-align: center;
      margin-top: 22px;
      font-size: 12.5px;
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
    }

    .hint span {
      font-weight: 500;
      color: #999;
    }

    /* Loading state on card */
    .card.loading .submit-btn {
      pointer-events: none;
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 560px) {
      .card {
        padding: 36px 24px 32px;
        border-radius: var(--radius-md);
      }

      .title {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
      }

      .input-group {
        flex-direction: column;
      }

      .submit-btn {
        justify-content: center;
        width: 100%;
      }

      .header {
        margin-bottom: 28px;
      }
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── 模式切换按钮 ── */
    .mode-toggle {
      display: block;
      margin: 12px auto 0;
      padding: 6px 16px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: none;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 16px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all var(--transition);
    }

    .mode-toggle:hover {
      color: var(--text-primary);
      border-color: rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.02);
    }

    /* ── 设置按钮（右上角）── */
    .settings-trigger {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      transition: all var(--transition);
      z-index: 10;
    }

    .settings-trigger:hover {
      color: #444;
      border-color: rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.85);
      transform: rotate(30deg);
    }

    /* ── 设置弹窗 ── */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    .settings-dialog {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 32px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      animation: fadeSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .settings-dialog h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .settings-dialog p {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .settings-input {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      font-family: 'DM Sans', 'Noto Sans SC', -apple-system, sans-serif;
      font-size: 14px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      outline: none;
      transition: all var(--transition);
      margin-bottom: 10px;
    }

    .settings-input:focus {
      border-color: rgba(0, 0, 0, 0.25);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.03);
    }

    .settings-links {
      margin-bottom: 20px;
    }

    .settings-links a {
      font-size: 12.5px;
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .settings-links a:hover {
      color: var(--text-primary);
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .settings-btn {
      height: 38px;
      padding: 0 22px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 510;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.01em;
    }

    .settings-btn.cancel {
      background: rgba(0, 0, 0, 0.05);
      color: #666;
    }

    .settings-btn.cancel:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .settings-btn.save {
      background: #1a1a1a;
      color: #fff;
    }

    .settings-btn.save:hover {
      background: #2d2d2f;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <div class="wrapper">
    <div class="card" id="card">
      <!-- Header -->
      <div class="header">
        <div class="badge">Powered by AI</div>
        <h1 class="title">AI 智能总结</h1>
        <p class="subtitle">粘贴链接，让 AI 为你提炼核心精华</p>
      </div>

      <!-- Input -->
      <div class="input-group">
        <div class="input-wrapper">
          <span class="icon-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
              <path d="M8 7v4m0 0v4m0-4H4m4 0h4" stroke-width="1.2" opacity="0.5"></path>
            </svg>
          </span>
          <input
            type="url"
            class="url-input"
            id="urlInput"
            placeholder="请在此粘贴视频或网页链接…"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="clear-btn" id="clearBtn" aria-label="清除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <button class="submit-btn" id="submitBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          开始总结
        </button>
      </div>

      <!-- Result -->
      <div class="result-area" id="resultArea">
        <div class="result-inner" id="resultInner"></div>
      </div>
    </div>

    <p class="hint">支持 <span>视频链接</span> · <span>网页文章</span> · <span>社交媒体</span> 等多种内容</p>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');
    const resultArea = document.getElementById('resultArea');
    const resultInner = document.getElementById('resultInner');
    const card = document.getElementById('card');

    // ── API Key 管理 ──
    const STORAGE_KEY = 'ai_summary_apikey';
    let apiKey = localStorage.getItem(STORAGE_KEY) || '';

    // 页面加载时若没有 key，弹窗提示
    if (!apiKey) {
      setTimeout(showSettings, 600);
    }

    // ── 设置弹窗 ──
    function showSettings() {
      const existing = document.querySelector('.settings-overlay');
      if (existing) existing.remove();

      const overlay = document.createElement('div');
      overlay.className = 'settings-overlay';
      overlay.innerHTML = `
        <div class="settings-dialog">
          <h3>设置 API Key</h3>
          <p>使用 Anthropic API 进行智能总结。你的 Key 仅存储在浏览器本地，不会上传到任何服务器。</p>
          <input type="password" class="settings-input" placeholder="sk-ant-api03-…" value="${apiKey}">
          <div class="settings-links">
            <a href="https://console.anthropic.com/" target="_blank">获取 API Key ↗</a>
          </div>
          <div class="settings-actions">
            <button class="settings-btn cancel">取消</button>
            <button class="settings-btn save">保存</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const input = overlay.querySelector('.settings-input');
      overlay.querySelector('.save').addEventListener('click', () => {
        apiKey = input.value.trim();
        localStorage.setItem(STORAGE_KEY, apiKey);
        overlay.remove();
        if (apiKey) urlInput.focus();
      });
      overlay.querySelector('.cancel').addEventListener('click', () => {
        overlay.remove();
        if (apiKey) urlInput.focus();
      });
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.remove();
      });
      setTimeout(() => input.focus(), 100);
    }

    // ── 右上角设置按钮 ──
    const settingsBtn = document.createElement('button');
    settingsBtn.className = 'settings-trigger';
    settingsBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
    settingsBtn.title = 'API 设置';
    settingsBtn.addEventListener('click', showSettings);
    document.body.appendChild(settingsBtn);

    // ── 清除按钮 ──
    urlInput.addEventListener('input', () => {
      clearBtn.classList.toggle('visible', !!urlInput.value.trim());
    });

    clearBtn.addEventListener('click', () => {
      urlInput.value = '';
      clearBtn.classList.remove('visible');
      urlInput.focus();
      resultArea.classList.remove('active');
    });

    // ── 设置按钮状态 ──
    function setLoading(isLoading) {
      if (isLoading) {
        card.classList.add('loading');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> 分析中…';
        resultArea.classList.remove('active');
        resultInner.classList.remove('error');
      } else {
        card.classList.remove('loading');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>开始总结`;
      }
    }

    // ── 模式切换（URL / 文本）──
    let inputMode = 'url'; // 'url' | 'text'
    const modeToggle = document.createElement('button');
    modeToggle.className = 'mode-toggle';
    modeToggle.textContent = '✎ 直接粘贴文本';
    modeToggle.addEventListener('click', () => {
      if (inputMode === 'url') {
        inputMode = 'text';
        urlInput.placeholder = '请在此粘贴需要总结的文字内容…';
        urlInput.type = 'text';
        urlInput.removeAttribute('type');
        urlInput.style.paddingRight = '18px';
        clearBtn.style.display = 'none';
        modeToggle.textContent = '🔗 输入链接';
        document.querySelector('.icon-left svg').innerHTML = `<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>`;
      } else {
        inputMode = 'url';
        urlInput.placeholder = '请在此粘贴视频或网页链接…';
        urlInput.type = 'url';
        urlInput.style.paddingRight = '48px';
        clearBtn.style.display = '';
        modeToggle.textContent = '✎ 直接粘贴文本';
        document.querySelector('.icon-left svg').innerHTML = `<circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path><path d="M8 7v4m0 0v4m0-4H4m4 0h4" stroke-width="1.2" opacity="0.5"></path>`;
      }
      urlInput.value = '';
      resultArea.classList.remove('active');
      urlInput.focus();
    });
    document.querySelector('.input-group').insertAdjacentElement('afterend', modeToggle);

    // ── CDP 抓取（本地兜底）──
    async function fetchViaCDP(url) {
      const proxyUrl = 'http://localhost:3456';
      // 检查 CDP Proxy 是否可用
      try {
        const health = await fetch(`${proxyUrl}/health`);
        if (!health.ok) return null;
      } catch { return null; }

      // 打开新 tab
      const tabRes = await fetch(`${proxyUrl}/new`, {
        method: 'POST',
        body: url
      });
      const { targetId } = await tabRes.json();
      if (!targetId) return null;

      // 等待页面加载
      await new Promise(r => setTimeout(r, 5000));

      // 提取文本
      const textRes = await fetch(`${proxyUrl}/eval?target=${targetId}`, {
        method: 'POST',
        body: 'document.body.innerText'
      });
      const { value: text } = await textRes.json();

      // 关闭 tab
      await fetch(`${proxyUrl}/close?target=${targetId}`);

      return text || null;
    }

    // ── 核心：抓取 + 总结 ──
    submitBtn.addEventListener('click', async () => {
      const rawInput = urlInput.value.trim();
      if (!rawInput) {
        urlInput.focus();
        urlInput.style.borderColor = 'rgba(192, 57, 43, 0.3)';
        urlInput.style.boxShadow = '0 0 0 4px rgba(192, 57, 43, 0.05)';
        setTimeout(() => { urlInput.style.borderColor = ''; urlInput.style.boxShadow = ''; }, 1200);
        return;
      }

      if (!apiKey) {
        showSettings();
        return;
      }

      setLoading(true);
      resultInner.classList.remove('error');
      resultArea.classList.add('active');

      try {
        let content;

        if (inputMode === 'text') {
          // 直接使用用户粘贴的文本
          resultInner.textContent = '🤖 正在 AI 智能总结…';
          content = rawInput;
        } else {
          // ── URL 模式：Jina → CDP 双层兜底 ──
          resultInner.textContent = '⏳ 正在通过 Jina 抓取页面内容…';

          const jinaUrl = `https://r.jina.ai/${rawInput}`;
          const jinaRes = await fetch(jinaUrl, {
            headers: { 'Accept': 'text/markdown' }
          });

          let rawContent = '';
          if (jinaRes.ok) {
            rawContent = await jinaRes.text();
          }

          // 判断 Jina 结果是否有效
          const poorPatterns = [
            '你要观看的视频不存在', '页面不存在', '内容不存在',
            '请打开抖音', '打开APP', '下载APP', '打开 App',
            'download the app', 'get the app'
          ];
          const isPoor = !rawContent || rawContent.length < 100 ||
            poorPatterns.some(p => rawContent.includes(p));

          if (isPoor) {
            resultInner.textContent = '⏳ Jina 被反爬拦截，尝试 CDP 浏览器直连…';

            const cdpContent = await fetchViaCDP(rawInput);
            if (cdpContent && cdpContent.length > 100) {
              rawContent = cdpContent;
            } else {
              throw new Error(
                '该网站屏蔽了自动抓取（Jina + CDP 均失败）。\n\n' +
                '💡 建议：点击输入框下方的「✎ 直接粘贴文本」，将视频标题/描述/评论区文字粘贴进来即可总结。'
              );
            }
          }

          resultInner.textContent = '🤖 正在 AI 智能总结…';

          // 截断过长内容
          const maxChars = 8000;
          content = rawContent.length > maxChars
            ? rawContent.slice(0, maxChars) + '\n\n[内容过长，已截断前 8000 字符]'
            : rawContent;
        }

        // ── 调用 Anthropic API 总结 ──
        const systemPrompt = `你是一个专业的内容总结助手。请根据提供的内容，用中文给出简洁清晰的总结。按以下格式输出：

1. 📌 核心主题：一句话概括
2. 📝 关键要点：用列表列出 3-5 个关键信息点
3. 💡 亮点/洞察：1-2 句话
4. 🏷 内容类型标签：用 2-3 个标签

注意：
- 如果内容是视频页面/社交媒体，根据标题、描述、评论等可用信息总结
- 如果内容看起来不完整或混乱，如实说明，不要编造
- 保持客观，不要添加原文没有的信息
- 控制总字数在 300 字以内`;

        const aiRes = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 600,
            system: systemPrompt,
            messages: [
              { role: 'user', content: `以下是需要总结的内容：\n\n${content}` }
            ]
          })
        });

        if (!aiRes.ok) {
          const errData = await aiRes.json().catch(() => ({}));
          if (aiRes.status === 401) {
            localStorage.removeItem(STORAGE_KEY);
            apiKey = '';
            throw new Error('API Key 无效，请重新设置');
          }
          throw new Error(`AI API 请求失败 (HTTP ${aiRes.status}): ${errData.error?.message || '未知错误'}`);
        }

        const aiData = await aiRes.json();
        const summary = aiData.content?.[0]?.text || '(AI 返回了空结果)';

        resultInner.innerHTML = summary
          .replace(/\n/g, '<br>')
          .replace(/^(\d+\.\s)/gm, '<strong>$1</strong>');
        resultInner.classList.remove('error');
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      } catch (err) {
        console.error('总结失败:', err);
        resultInner.textContent = `❌ ${err.message}`;
        resultInner.classList.add('error');
      } finally {
        setLoading(false);
      }
    });

    // ── 键盘快捷键 ──
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.activeElement === urlInput) {
        e.preventDefault();
        submitBtn.click();
      }
    });

    urlInput.focus();
  </script>
</body>
</html>
